appId: com.revolt.apptodate
productName: app
directories:
  buildResources: build
files:
  - out/**
mac:
  icon: build/icon.icon
  # self-signed local identity for personal use; no team id, so hardened runtime
  # library validation would reject the electron framework, and apple's timestamp
  # server adds a network round trip that only matters for distribution
  identity: Local Development Code Signing
  hardenedRuntime: false
  timestamp: none
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
